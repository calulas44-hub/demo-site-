<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>MYKONOS — Administration</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#17110f" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2317110f'/%3E%3Ctext x='50' y='68' font-size='54' text-anchor='middle' fill='%23E4141B' font-family='Arial' font-weight='bold'%3EM%3C/text%3E%3C/svg%3E" />
</head>
<body class="adm-body">

  <!-- ============ LOGIN ============ -->
  <div class="adm-login" id="admLogin">
    <div class="card">
      <div class="display" style="font-size:34px">👑 MYKONOS</div>
      <p style="color:var(--muted);margin-top:0">Espace administrateur</p>
      <div class="field">
        <label class="sr-only" for="admCode">Code d'accès</label>
        <input class="input code-input" id="admCode" inputmode="numeric" maxlength="8" placeholder="••••" autocomplete="off" />
      </div>
      <button class="btn btn--red btn--block btn--lg" id="admLoginBtn">Entrer</button>
      <p id="admLoginErr" style="color:var(--red);font-weight:600;min-height:20px;margin:10px 0 0"></p>
      <p style="font-size:12px;color:var(--muted);margin-top:14px"><a href="index.html">← Retour au site</a></p>
    </div>
  </div>

  <!-- ============ APP ============ -->
  <div class="adm-shell hidden" id="admApp">
    <aside class="adm-side" id="admSide">
      <div class="display">👑 MYKONOS</div>
      <nav class="adm-nav" id="admNav">
        <button data-sec="dashboard" class="active"><span class="em">📊</span> Tableau de bord</button>
        <button data-sec="orders"><span class="em">🧾</span> Commandes</button>
        <button data-sec="products"><span class="em">🥙</span> Produits</button>
        <button data-sec="categories"><span class="em">🗂️</span> Catégories</button>
        <button data-sec="drinks"><span class="em">🥤</span> Boissons</button>
        <button data-sec="sauces"><span class="em">🌶️</span> Sauces</button>
        <button data-sec="crudites"><span class="em">🥗</span> Crudités</button>
        <button data-sec="promos"><span class="em">🎁</span> Promotions</button>
        <button data-sec="customers"><span class="em">👥</span> Clients</button>
        <button data-sec="newsletter"><span class="em">📧</span> Newsletter</button>
        <button data-sec="settings"><span class="em">⚙️</span> Réglages</button>
      </nav>
      <div style="padding:14px 10px;margin-top:10px;border-top:1px solid rgba(255,255,255,.1)">
        <a href="index.html" class="btn btn--ghost btn--sm btn--block" style="color:#fff;border-color:rgba(255,255,255,.25)" target="_blank">🔗 Voir le site</a>
        <button class="btn btn--ghost btn--sm btn--block" id="admLogout" style="color:#ffb3b3;border-color:rgba(255,255,255,.15);margin-top:8px">Déconnexion</button>
      </div>
    </aside>

    <main class="adm-main">
      <div class="adm-topbar">
        <button class="btn btn--ghost btn--sm adm-menu-toggle" id="admMenuToggle">☰</button>
        <h1 id="admTitle">Tableau de bord</h1>
        <div class="right">
          <button class="btn btn--red btn--sm" id="admSoundToggle" title="Alerte sonore + notification à chaque nouvelle commande">🔔 Son activé</button>
          <span class="pill pill--ok" id="admSaveState">Enregistré ✓</span>
        </div>
      </div>
      <div id="admContent"><!-- section injectée --></div>
    </main>
  </div>

  <div class="overlay" id="admOverlay"></div>
  <div class="toast-wrap" id="toastWrap"></div>

  <!-- Modale générique admin -->
  <div class="modal-wrap" id="admModalWrap">
    <div class="modal-backdrop" id="admModalBackdrop"></div>
    <div class="modal" id="admModal"></div>
  </div>

  <!-- EmailJS (optionnel : bouton "e-mail de test" dans Réglages) -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
