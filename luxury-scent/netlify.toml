# Netlify — site Luxury Scent (répertoire de base : luxury-scent)
# Variables d'environnement : à saisir dans Netlify (Site configuration → Environment variables),
# jamais dans ce fichier. Liste complète : docs/04-netlify-supabase.md
[build]
  command = "npm run build:netlify"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  # Le build ne doit pas tenter de télécharger un navigateur.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  included_files = ["node_modules/pdfkit/js/data/**", "node_modules/.prisma/client/libquery_engine-rhel-openssl-3.0.x.so.node", "node_modules/.prisma/client/schema.prisma"]
